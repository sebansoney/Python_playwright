[project]
name = "automation-framework"
version = "0.1.0"
description = "AI-assisted Python + Playwright automation framework (UI, API, integration)"
readme = "README.md"
requires-python = ">=3.12,<3.14"

# Framework runtime dependencies. Exact versions are pinned in uv.lock
# (generated by `uv lock`); the ranges below only state compatibility.
dependencies = [
    # Test runner + plugins
    "pytest>=8.3,<10",
    "pytest-playwright>=0.6,<1",
    "pytest-xdist>=3.6,<4",
    "pytest-rerunfailures>=15.0,<17",
    "allure-pytest>=2.13,<3",
    # Browser + HTTP
    "playwright>=1.49,<2",
    "httpx>=0.28,<1",
    # Config, validation, data
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "jsonschema>=4.23,<5",
    "Faker>=30.0",
    "filelock>=3.16,<4",
    # AI (optional at runtime: framework works without a key)
    "anthropic>=0.40",
]

[dependency-groups]
# Sample application under test (also listed in sample_application/requirements.txt
# so the app can be installed on its own).
app = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy>=2.0.36,<3",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.17",
    "pyjwt>=2.10,<3",
    "bcrypt>=4.2,<6",
]
dev = [
    "ruff>=0.8",
]

[tool.uv]
# Not an installable package: modules are imported from the repo root.
package = false
default-groups = ["app", "dev"]

# --------------------------------------------------------------------------- #
# Pytest                                                                       #
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "smoke: critical-path checks, run on every change (subset of regression)",
    "sanity: quick checks of a specific area after a change (subset of regression)",
    "regression: full functional suite (auto-applied to every ui/api/integration test)",
    "ui: browser tests (auto-applied from tests/ui)",
    "api: REST API tests (auto-applied from tests/api)",
    "integration: combined UI + API tests (auto-applied from tests/integration)",
    "unit: framework self-tests, no app or browser needed (auto-applied from tests/unit)",
    "ai_live: real Claude API calls - cost money; run only with FW_AI_LIVE=1 and an API key",
]
xfail_strict = true
filterwarnings = [
    # Raised by pytest-playwright's own fallback `base_url` fixture (not our code).
    # Harmless while pytest is pinned <10; re-check when upgrading either package.
    "ignore:Session-scoped fixtures defined as instance methods are deprecated:pytest.PytestRemovedIn10Warning",
]
log_level = "INFO"
log_format = "%(asctime)s %(levelname)-8s %(name)s | %(message)s"
log_date_format = "%H:%M:%S"

# --------------------------------------------------------------------------- #
# Ruff (lint + format)                                                         #
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".python", "ai_drafts"]

[tool.ruff.format]
# Code examples inside Markdown docs are illustrations; keep their hand layout.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "PT",       # pytest style
    "RUF",      # ruff-specific
    "TID",      # tidy imports (banned APIs below)
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.sleep".msg = "Hard waits are banned. Use Playwright auto-waiting / expect(), or polling helpers."

[tool.ruff.lint.per-file-ignores]
# The sample app is the system under test, not framework code.
"sample_application/**" = ["TID251"]
